spring:
  datasource:
    url: ${DEV_DATABASE_URL:jdbc:h2:file:./data/teample}
    username: ${DEV_DATABASE_USERNAME:sa}
    password: ${DEV_DATABASE_PASSWORD:}
    driver-class-name: ${DEV_DATABASE_DRIVER:org.h2.Driver}
app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
admin:
  test-enabled: ${ADMIN_TEST_ENABLED:false}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
