spring:
  application:
    name: teample-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:teample}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

# Anthropic Claude API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
