spring:
  application:
    name: teample-backend
  profiles:
    default: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

# Anthropic Claude API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:}
admin:
  test-enabled: false
ai:
  daily-limit: ${AI_DAILY_LIMIT:20}
  concurrent-limit: ${AI_CONCURRENT_LIMIT:4}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
